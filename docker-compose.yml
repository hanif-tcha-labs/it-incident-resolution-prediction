services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-incident-simulator
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - LOKY_MAX_CPU_COUNT=4
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
